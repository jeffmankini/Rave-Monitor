<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rave Monitor share card</title>
<!--
  The 1200x630 image that link previews show (site/static/og-image.jpg).
  To make a new one from the current feed, serve the repo root and screenshot this page at 1200x630:
    python3 -m http.server 8000
    npx playwright screenshot --viewport-size=1200,630 --wait-for-timeout=3000 \
      "http://localhost:8000/scripts/og-card.html" site/static/og-image.jpg
  ?feed= points at another events.json (default ../public/events.json).
-->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Unbounded:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #070814; }
  canvas { position: absolute; inset: 0; }
  .shade { position: absolute; inset: 0; background:
    radial-gradient(ellipse 760px 380px at 250px 120px, rgba(7,8,20,.94) 0%, rgba(7,8,20,.78) 45%, rgba(7,8,20,0) 100%),
    linear-gradient(0deg, rgba(7,8,20,.85) 0, rgba(7,8,20,0) 120px); }
  .text { position: absolute; left: 72px; top: 64px; color: #eceaf6; font-family: Archivo, sans-serif; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 62px; height: 62px; color: #f6ecd8; flex: none; }
  .word { font-family: Unbounded, sans-serif; font-weight: 800; font-size: 60px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
  .by { margin: 18px 0 0 82px; font-size: 32px; font-weight: 600; color: #f6ecd8; }
  .tag { margin: 30px 0 0 82px; font-size: 30px; font-weight: 500; color: #a9abcb; line-height: 1.3; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; align-items: center;
    font-family: Archivo, sans-serif; font-size: 22px; font-weight: 500; color: #7c7fa3; }
  .legend { display: flex; gap: 22px; }
  .legend span { display: inline-flex; align-items: center; gap: 9px; color: #a9abcb; }
  .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>
<canvas id="map" width="1200" height="630"></canvas>
<div class="shade"></div>
<div class="text">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.5a9.5 9.5 0 0 1 0 19z" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="#070814"/></svg>
    <div class="word">Rave Monitor</div>
  </div>
  <div class="by">by split/shift</div>
  <div class="tag">Electronic music map:<br>raves, club nights and DJ sets</div>
</div>
<div class="foot">
  <div>ravemonitor.com</div>
  <div class="legend" id="legend"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script>
const COLORS = { techno: '#3987e5', house: '#d95926', dnb: '#199e70', afro: '#c98500', disco: '#d55181', garage: '#008300', trance: '#9085e9', bass: '#e66767', electronic: '#22b8cf', misc: '#8b8fa8', other: '#8b8fa8' };
const NAMES = { techno: 'Techno', house: 'House', dnb: 'Drum & bass', afro: 'Afro', disco: 'Disco' };
document.getElementById('legend').innerHTML = Object.keys(NAMES).map(k => `<span><i style="background:${COLORS[k]}"></i>${NAMES[k]}</span>`).join('');

(async () => {
  const q = new URLSearchParams(location.search);
  const [geo, feed] = await Promise.all([
    fetch(q.get('geo') || '../site/geo.json').then(r => r.json()),
    fetch(q.get('feed') || '../public/events.json').then(r => r.json()).catch(() => ({ events: [] }))
  ]);
  const ctx = document.getElementById('map').getContext('2d');
  // Mercator like the site, framed on North America and Europe, where most listings are.
  const s = 1200 / Math.PI;
  const proj = d3.geoMercator().rotate([45, 0]).scale(s).translate([600, s * Math.log(Math.tan(Math.PI / 4 + (70 * Math.PI / 180) / 2))]);
  const path = d3.geoPath(proj, ctx);
  ctx.fillStyle = '#070814'; ctx.fillRect(0, 0, 1200, 630);
  ctx.beginPath(); path(d3.geoGraticule10()); ctx.strokeStyle = 'rgba(150,160,230,0.05)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); path(topojson.feature(geo.hi, geo.hi.objects.land)); ctx.fillStyle = '#171c3a'; ctx.fill();
  ctx.beginPath(); path(topojson.mesh(geo.lo, geo.lo.objects.countries, (a, b) => a !== b)); ctx.strokeStyle = 'rgba(160,170,230,0.12)'; ctx.lineWidth = 0.8; ctx.stroke();
  // Each city's events as a small spiral of dots around the city, like the site's zoomed-out view,
  // with a soft glow in the city's most common genre colour.
  const cities = Object.fromEntries((feed.cities || []).map(c => [c.id, c]));
  const groups = {};
  for (const e of feed.events) {
    const c = cities[e.cityId] || (e.venue && Number.isFinite(e.venue.lat) ? { lat: e.venue.lat, lon: e.venue.lon } : null);
    if (!c) continue;
    (groups[e.cityId] ||= { c, colors: [] }).colors.push(COLORS[(e.genres || [])[0]] || COLORS.other);
  }
  let drawn = 0;
  const clusters = Object.values(groups).map(g => {
    const [x, y] = proj([g.c.lon, g.c.lat]);
    const tally = {}; for (const col of g.colors) tally[col] = (tally[col] || 0) + 1;
    const main = Object.entries(tally).sort((a, b) => b[1] - a[1])[0][0];
    return { x, y, colors: g.colors, main, r: 1.9 * Math.sqrt(g.colors.length) };
  }).filter(k => k.x > -40 && k.x < 1240 && k.y > -40 && k.y < 670);
  for (const k of clusters) {
    const R = k.r + 22, g = ctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, R);
    g.addColorStop(0, k.main + '55'); g.addColorStop(1, k.main + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(k.x, k.y, R, 0, Math.PI * 2); ctx.fill();
  }
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  for (const k of clusters) {
    k.colors.forEach((col, i) => {
      const r = 1.9 * Math.sqrt(i + 0.5), a = i * GOLDEN;
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(k.x + r * Math.cos(a), k.y + r * Math.sin(a), 1.55, 0, Math.PI * 2); ctx.fill();
      drawn++;
    });
  }
  await document.fonts.ready;
  document.body.dataset.ready = String(drawn);
})();
</script>
</body>
</html>
