name: Refresh listings

# Every 3 hours, mainly so the Streams tab stays current. Each source reuses its last pull until it
# is older than maxAgeHours in config/sources.json: the free APIs refresh about daily, the paid
# scrapers monthly, so the extra runs cost nothing.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      fresh:
        description: Ignore saved scrapes and pull every source again
        type: boolean
        default: false
      pull:
        description: "Pull just these again now, e.g. ra:berlin,ra:london (empty: usual schedule)"
        type: string
        default: ''

permissions:
  contents: write   # to push the archive branch
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore saved scrapes
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: scrapes-${{ github.run_id }}
          restore-keys: scrapes-
      - name: Build the feed
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          SKIDDLE_KEY: ${{ secrets.SKIDDLE_KEY }}
          PULL: ${{ inputs.pull }}
        run: |
          mkdir -p cache && touch cache/.keep
          node pipeline/run.js ${{ inputs.fresh && '--fresh' || '' }} ${PULL:+--pull "$PULL"}
      - name: Build the livestream list
        # NTS needs no key. YouTube needs the free YOUTUBE_KEY secret and is skipped without it.
        continue-on-error: true
        env:
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        run: node pipeline/streams.js
      - name: Update the archive
        # Every listing is kept in the archive branch, merged across platforms. A problem here
        # shouldn't stop the site from deploying.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin archive > /dev/null; then
            git fetch -q --depth=1 origin archive
            git worktree add -q -B archive archive-data FETCH_HEAD
          else
            git worktree add -q --orphan -b archive archive-data
          fi
          node pipeline/archive.js archive-data public/events.json cache/not-electronic.json
          # OpenStreetMap's clubs around each city, about once a week (pipeline/osm.js).
          node pipeline/osm.js archive-data || echo "OpenStreetMap refresh failed; keeping the last lists."
          cd archive-data
          git add -A
          if git diff --cached --quiet; then echo "Archive unchanged."; else git commit -q -m "Archive $(date -u +%F)" && git push -q origin archive; fi
      - name: Save scrapes for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: scrapes-${{ github.run_id }}
      - name: Build the site
        run: |
          node scripts/build-site.js
          if [ -d archive-data/events ]; then node --no-warnings pipeline/archive-export.js archive-data dist/archive; fi
      - name: Deploy to Netlify (optional)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            npx --yes netlify-cli@17 deploy --prod --dir=dist --site "$NETLIFY_SITE_ID"
          else
            echo "Netlify secrets not set; deploying to GitHub Pages only."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Alerts for people with accounts (pipeline/notify.js), once the new listings are live: new shows
  # from who they follow, reminders and changes for saved shows, weekly picks, and the emails.
  # Does nothing until accounts are set up (see the README).
  alerts:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write and email alerts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
        run: node pipeline/notify.js --feed https://ravemonitor.com/events.json --venues https://ravemonitor.com/archive/data/venues.json
