name: Deploy the contact form Worker

# The contact form's back end (worker/contact) on Cloudflare, at https://api.ravemonitor.com/contact.
# Runs when the Worker changes, or by hand from the Actions tab.
#
# GitHub Actions secrets it needs:
#   CLOUDFLARE_API_TOKEN   "Edit Cloudflare Workers" template, plus Zone > DNS > Edit for ravemonitor.com
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard
#   CONTACT_TO             the verified Email Routing destination address messages go to
#   TURNSTILE_SECRET       the Turnstile widget's secret key
on:
  push:
    branches: [main]
    paths: ['worker/contact/**', '.github/workflows/contact-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the Worker
        run: node --test test/contact-worker.test.js
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONTACT_TO TURNSTILE_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub Actions secrets:$missing"; exit 1; fi
      - name: Check the Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          say() { echo "$1: $(echo "$2" | jq -r 'if .success then "ok" else "FAILED " + ([.errors[]? | "\(.code) \(.message)"] | join("; ")) end')"; }
          say "Token is valid" "$(api /user/tokens/verify)"
          accounts=$(api '/accounts?per_page=50')
          if [ "$(echo "$accounts" | jq '.result | length')" = "0" ]; then
            echo "::error::This token can't use any Cloudflare account. Edit it: add Account > Workers Scripts > Edit (and Account Settings > Read), and set Account Resources to your account."
          elif echo "$accounts" | jq -e --arg a "$CF_ACCOUNT" '[.result[]?.id] | index($a)' > /dev/null; then echo "CLOUDFLARE_ACCOUNT_ID: matches an account the token can use"
          else echo "::error::CLOUDFLARE_ACCOUNT_ID isn't an account this token can use. Copy the Account ID (not the Zone ID) from the dashboard."; fi
          say "Account access" "$(api "/accounts/$CF_ACCOUNT")"
          say "Workers Scripts (account)" "$(api "/accounts/$CF_ACCOUNT/workers/scripts")"
          zone=$(api '/zones?name=ravemonitor.com' | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then echo "::error::The token can't see the ravemonitor.com zone. Add the zone to the token's Zone Resources."; else
            say "Workers Routes (ravemonitor.com)" "$(api "/zones/$zone/workers/routes")"
            say "DNS (ravemonitor.com)" "$(api "/zones/$zone/dns_records?per_page=1")"
            api "/zones/$zone/dns_records?per_page=1" | jq -e .success > /dev/null || echo "::error::The token needs Zone > DNS > Edit for ravemonitor.com, so the Worker can have api.ravemonitor.com."
          fi
      - name: Deploy to Cloudflare
        working-directory: worker/contact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Set the Worker's secrets
        working-directory: worker/contact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          jq -n '{CONTACT_TO: env.CONTACT_TO, TURNSTILE_SECRET: env.TURNSTILE_SECRET}' > "$RUNNER_TEMP/secrets.json"
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Check it answers
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://ravemonitor.com' https://api.ravemonitor.com/contact || true)
            echo "OPTIONS /contact: $code"
            [ "$code" = "204" ] && exit 0
            sleep 20
          done
          echo "::warning::api.ravemonitor.com isn't answering yet. A new custom domain's certificate can take a few minutes."
