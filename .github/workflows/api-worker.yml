name: Deploy the API Worker

# The Worker behind https://api.ravemonitor.com (worker/api): the contact form (/contact) and
# accounts (/v1/...). Runs when the Worker changes, or by hand from the Actions tab.
#
# GitHub Actions secrets it needs:
#   CLOUDFLARE_API_TOKEN   Account > Workers Scripts > Edit, Account Settings > Read, Zone > Workers Routes > Edit,
#                          and for accounts Account > D1 > Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard
#   CONTACT_TO             the verified Email Routing destination address messages go to
#   TURNSTILE_SECRET       the Turnstile widget's secret key
#   POSTMARK_TOKEN         for accounts: the Postmark server's API token (sign-in links and alerts)
#   STRIPE_SECRET_KEY      for donations (once or monthly): a Stripe restricted key (rk_live_…) with Write
#                          on Checkout Sessions, Products, Prices, Customer portal, Webhook Endpoints and
#                          Payment Method Domains, and Read on Subscriptions. The deploy makes the donation product and turns on the
#                          customer portal's login page, where monthly donors change or cancel.
#   STRIPE_PUBLISHABLE_KEY optional: the publishable key (pk_live_…) in the same mode. With it, Stripe's
#                          checkout opens inside the site's Donate pop-up; without it, on Stripe's own page.
#                          After changing either key, run this workflow by hand.
# Without D1 access it deploys the contact form alone; without POSTMARK_TOKEN sign-in stays off;
# without STRIPE_SECRET_KEY donations stay off.
on:
  push:
    branches: [main]
    paths: ['worker/api/**', 'test/api-*.test.js', '.github/workflows/api-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the Worker
        run: node --test test/api-contact.test.js test/api-accounts.test.js test/api-donate.test.js test/keys.test.js
      - name: Check the secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          missing=""
          for k in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CONTACT_TO TURNSTILE_SECRET; do
            [ -n "${!k}" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub Actions secrets:$missing"; exit 1; fi
      - name: Check the Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          say() { echo "$1: $(echo "$2" | jq -r 'if .success then "ok" else "FAILED " + ([.errors[]? | "\(.code) \(.message)"] | join("; ")) end')"; }
          say "Token is valid" "$(api /user/tokens/verify)"
          accounts=$(api '/accounts?per_page=50')
          if [ "$(echo "$accounts" | jq '.result | length')" = "0" ]; then
            echo "::error::This token can't use any Cloudflare account. Edit it: add Account > Workers Scripts > Edit (and Account Settings > Read), and set Account Resources to your account."
          elif echo "$accounts" | jq -e --arg a "$CF_ACCOUNT" '[.result[]?.id] | index($a)' > /dev/null; then echo "CLOUDFLARE_ACCOUNT_ID: matches an account the token can use"
          else echo "::error::CLOUDFLARE_ACCOUNT_ID isn't an account this token can use. Copy the Account ID (not the Zone ID) from the dashboard."; fi
          say "Account access" "$(api "/accounts/$CF_ACCOUNT")"
          say "Workers Scripts (account)" "$(api "/accounts/$CF_ACCOUNT/workers/scripts")"
          zone=$(api '/zones?name=ravemonitor.com' | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then echo "::error::The token can't see the ravemonitor.com zone. Add the zone to the token's Zone Resources."; else
            say "Workers Routes (ravemonitor.com)" "$(api "/zones/$zone/workers/routes")"
            say "DNS (ravemonitor.com)" "$(api "/zones/$zone/dns_records?per_page=1")"
            # Not needed so far: the custom domain was created without it.
            api "/zones/$zone/dns_records?per_page=1" | jq -e .success > /dev/null || echo "::notice::The token can't read DNS records. That's fine unless api.ravemonitor.com stops resolving; then add Zone > DNS > Edit."
          fi
      - name: Check the contact settings
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          # A made-up token: a working secret answers invalid-input-response, a wrong one invalid-input-secret.
          codes=$(curl -s https://challenges.cloudflare.com/turnstile/v0/siteverify --data-urlencode "secret=$TURNSTILE_SECRET" --data-urlencode "response=setup-check" | jq -r '."error-codes" | join(",")')
          echo "Turnstile secret check: $codes"
          case "$codes" in *invalid-input-secret*) echo "::error::TURNSTILE_SECRET isn't a valid Turnstile secret key. Copy the Secret Key from the ravemonitor.com widget in Cloudflare > Turnstile.";; esac
          case "$CONTACT_TO" in
            *@ravemonitor.com) echo "::warning::CONTACT_TO is an @ravemonitor.com address. Cloudflare only delivers to verified destination addresses: use the inbox hello@ravemonitor.com forwards to.";;
            *@*) echo "CONTACT_TO: an outside address (good)";;
            *) echo "::error::CONTACT_TO doesn't look like an email address.";;
          esac
          dest=$(curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/email/routing/addresses?per_page=50")
          if [ "$(echo "$dest" | jq -r .success)" = "true" ]; then
            state=$(echo "$dest" | jq -r --arg e "$CONTACT_TO" '[.result[] | select((.email | ascii_downcase) == ($e | ascii_downcase))][0] | if . == null then "not listed" elif .verified then "verified" else "not verified yet" end')
            echo "CONTACT_TO in Email Routing destination addresses: $state"
            [ "$state" = "verified" ] || echo "::error::CONTACT_TO must be a verified destination address in Cloudflare Email Routing (it is $state)."
          else
            echo "Can't read Email Routing destination addresses with this token (optional: Account > Email Routing Addresses > Read)."
          fi
      - name: Set up the accounts database
        id: db
        working-directory: worker/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          list=$(api "$base?name=ravemonitor-accounts")
          if [ "$(echo "$list" | jq -r .success)" != "true" ]; then
            echo "::notice::The Cloudflare token can't use D1 ($(echo "$list" | jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")')). Deploying the contact form alone. To switch on accounts, edit the token and add Account > D1 > Edit."
            # No database binding, so the deploy doesn't need one.
            node -e "const fs=require('fs');const f='wrangler.toml';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/\n# Accounts\.[\s\S]*?migrations_dir = \"migrations\"\n/,'\n'))"
            echo "on=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          id=$(echo "$list" | jq -r '[.result[]? | select(.name == "ravemonitor-accounts")][0].uuid // empty')
          if [ -z "$id" ]; then
            made=$(api -X POST "$base" -d '{"name":"ravemonitor-accounts"}')
            id=$(echo "$made" | jq -r '.result.uuid // empty')
            [ -n "$id" ] || { echo "::error::Couldn't create the accounts database: $(echo "$made" | jq -c .errors)"; exit 1; }
            echo "Created the ravemonitor-accounts database."
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.toml
          npx --yes wrangler@4 d1 migrations apply ravemonitor-accounts --remote
          echo "on=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        working-directory: worker/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Set the Worker's secrets
        working-directory: worker/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          jq -n '{CONTACT_TO: env.CONTACT_TO, TURNSTILE_SECRET: env.TURNSTILE_SECRET} + (if (env.POSTMARK_TOKEN // "") != "" then {POSTMARK_TOKEN: env.POSTMARK_TOKEN} else {} end)
            + (if (env.STRIPE_SECRET_KEY // "") != "" then {STRIPE_SECRET_KEY: env.STRIPE_SECRET_KEY} else {} end)
            + (if (env.STRIPE_PUBLISHABLE_KEY // "") != "" then {STRIPE_PUBLISHABLE_KEY: env.STRIPE_PUBLISHABLE_KEY} else {} end)' > "$RUNNER_TEMP/secrets.json"
          npx --yes wrangler@4 secret bulk "$RUNNER_TEMP/secrets.json"
          rm -f "$RUNNER_TEMP/secrets.json"
          [ -n "$POSTMARK_TOKEN" ] || echo "::notice::POSTMARK_TOKEN isn't set, so sign-in stays off. Add the Postmark server's API token as a secret to switch it on."
      - name: Check Postmark
        env:
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_TOKEN }}
        run: |
          [ -n "$POSTMARK_TOKEN" ] || { echo "No POSTMARK_TOKEN; skipping."; exit 0; }
          server=$(curl -s -H "Accept: application/json" -H "X-Postmark-Server-Token: $POSTMARK_TOKEN" https://api.postmarkapp.com/server)
          if echo "$server" | jq -e .ID > /dev/null; then echo "Postmark server: $(echo "$server" | jq -r .Name)"
          else echo "::error::POSTMARK_TOKEN isn't a working Postmark server token: $(echo "$server" | jq -r '.Message // "no answer"'). Copy it from your server's API Tokens tab in Postmark."; exit 0; fi
          # Postmark's black hole address takes the message and never delivers it (it counts as one email).
          sent=$(curl -s -X POST https://api.postmarkapp.com/email -H "Accept: application/json" -H "Content-Type: application/json" -H "X-Postmark-Server-Token: $POSTMARK_TOKEN" \
            -d '{"From":"Rave Monitor <hello@ravemonitor.com>","To":"test@blackhole.postmarkapp.com","Subject":"Rave Monitor setup check","TextBody":"A setup check from the API Worker deploy.","MessageStream":"outbound","Tag":"setup-check"}')
          if [ "$(echo "$sent" | jq -r .ErrorCode)" = "0" ]; then echo "Postmark accepts mail from hello@ravemonitor.com."
          else echo "::error::Postmark won't send from hello@ravemonitor.com yet: $(echo "$sent" | jq -r '.Message // "no answer"'). Check that ravemonitor.com is verified (DKIM and Return-Path) under Sender Signatures."; fi
      - name: Set up Stripe (donations)
        continue-on-error: true
        working-directory: worker/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        run: |
          [ -n "$STRIPE_SECRET_KEY" ] || { echo "No STRIPE_SECRET_KEY, so donations stay off."; exit 0; }
          case "$STRIPE_SECRET_KEY" in
            sk_test_*|rk_test_*) mode=test;; sk_live_*|rk_live_*) mode=live;;
            *) echo "::error::STRIPE_SECRET_KEY should be a restricted key (rk_live_…) or a secret key, not the publishable pk_ one."; exit 1;;
          esac
          echo "Stripe key: $mode mode"
          case "$STRIPE_PUBLISHABLE_KEY" in
            "") echo "::notice::No STRIPE_PUBLISHABLE_KEY, so checkout opens on Stripe's page instead of inside the Donate pop-up. Add the publishable key (pk_${mode}_…) as a secret to keep donors on the site.";;
            pk_${mode}_*) echo "Publishable key: $mode mode, so checkout opens inside the Donate pop-up.";;
            *) echo "::warning::STRIPE_PUBLISHABLE_KEY isn't a $mode-mode publishable key (pk_${mode}_…), so it's ignored and checkout opens on Stripe's page.";;
          esac
          # The same API version as worker/api/src/donate.js.
          s() { curl -s -u "$STRIPE_SECRET_KEY:" -H 'Stripe-Version: 2026-10-28.endive' "$@"; }
          ok() { echo "$1" | jq -e 'has("error") | not' > /dev/null; }
          fail() { echo "::error::$1: $(echo "$2" | jq -r '.error.message // "no answer"')"; exit 1; }
          api=https://api.stripe.com/v1
          # 1. The products gifts are for, one-time and monthly (Stripe's page reads "Subscribe to <name>" for
          #    those). Their ids are fixed, so the Worker needs no lookup.
          for spec in "rm_donation|Donation to Rave Monitor" "rm_donation_monthly|Monthly support for Rave Monitor"; do
            pid=${spec%%|*}; pname=${spec#*|}
            prod=$(s "$api/products/$pid")
            if ok "$prod"; then
              [ "$(echo "$prod" | jq -r .active)" = "true" ] || s "$api/products/$pid" -d active=true > /dev/null
              echo "Product $pid: in place."
            else
              made=$(s "$api/products" -d "id=$pid" -d "name=$pname" -d 'description=Keeps Rave Monitor free for everyone.' \
                -d 'images[]=https://ravemonitor.com/apple-touch-icon.png' -d 'metadata[app]=ravemonitor')
              ok "$made" || fail "The key can't create the product $pid (it needs Products: Write)" "$made"
              echo "Created the product $pid: $pname."
            fi
          done
          # 2. The customer portal: monthly donors sign in with their email to change their card or cancel.
          confs=$(s -G "$api/billing_portal/configurations" -d active=true -d limit=50)
          ok "$confs" || fail "The key can't read the customer portal settings (it needs Customer portal: Write)" "$confs"
          conf=$(echo "$confs" | jq -r '([.data[] | select(.metadata.app == "ravemonitor")][0].id) // ([.data[] | select(.is_default)][0].id) // empty')
          portal=(-d 'business_profile[headline]=Your monthly donation to Rave Monitor'
            -d 'business_profile[privacy_policy_url]=https://ravemonitor.com/privacy-policy/'
            -d 'business_profile[terms_of_service_url]=https://ravemonitor.com/terms-of-service/'
            -d 'default_return_url=https://ravemonitor.com/'
            -d 'features[subscription_cancel][enabled]=true' -d 'features[subscription_cancel][mode]=immediately' -d 'features[subscription_cancel][proration_behavior]=none'
            -d 'features[payment_method_update][enabled]=true' -d 'features[invoice_history][enabled]=true'
            -d 'login_page[enabled]=true' -d 'metadata[app]=ravemonitor')
          if [ -n "$conf" ]; then r=$(s "$api/billing_portal/configurations/$conf" "${portal[@]}"); else r=$(s "$api/billing_portal/configurations" "${portal[@]}"); fi
          ok "$r" || fail "The key can't change the customer portal settings (it needs Customer portal: Write)" "$r"
          echo "Customer portal: in place, with its login page $(echo "$r" | jq -r 'if .login_page.enabled then "on" else "OFF" end')."
          # 3. Apple Pay, Google Pay and Link inside the pop-up need the site's domain registered with Stripe.
          dom=$(s -G "$api/payment_method_domains" -d domain_name=ravemonitor.com)
          if ok "$dom"; then
            [ "$(echo "$dom" | jq '.data | length')" != "0" ] || dom=$(s "$api/payment_method_domains" -d domain_name=ravemonitor.com | jq '{data: [.]}')
            echo "Payment method domain ravemonitor.com: $(echo "$dom" | jq -r '.data[0] | "Apple Pay \(.apple_pay.status // "?"), Google Pay \(.google_pay.status // "?"), Link \(.link.status // "?")"')"
          else
            echo "::notice::The key can't register ravemonitor.com for wallets (it needs Payment Method Domains: Write). Card payments work anyway; for Apple Pay in the pop-up, add ravemonitor.com under Settings > Payment method domains in Stripe."
          fi
          # 4. What's left of the supporter tier: its price and product are archived, its webhook goes.
          old=$(s -G "$api/prices" -d 'lookup_keys[]=rm_supporter_monthly' -d active=true)
          for id in $(echo "$old" | jq -r '.data[]?.id'); do
            s "$api/prices/$id" -d active=false > /dev/null
            p=$(echo "$old" | jq -r --arg id "$id" '.data[] | select(.id == $id) | .product')
            [ -n "$p" ] && s "$api/products/$p" -d active=false > /dev/null
            echo "Archived the old supporter price $id and its product."
          done
          hooks=$(s -G "$api/webhook_endpoints" -d limit=100)
          for id in $(echo "$hooks" | jq -r '.data[]? | select(.url == "https://api.ravemonitor.com/v1/billing/webhook") | .id'); do
            s -X DELETE "$api/webhook_endpoints/$id" > /dev/null && echo "Removed the old supporter webhook $id."
          done
          stored=$(npx --yes wrangler@4 secret list 2>/dev/null || true)
          for k in STRIPE_WEBHOOK_SECRET_TEST STRIPE_WEBHOOK_SECRET_LIVE; do
            if echo "$stored" | grep -q "\"$k\""; then npx --yes wrangler@4 secret delete "$k" > /dev/null 2>&1 && echo "Removed the Worker's $k."; fi
          done
          subs=$(s -G "$api/subscriptions" -d status=all -d limit=100)
          if ok "$subs"; then echo "Subscriptions ($mode mode, monthly donations): $(echo "$subs" | jq '.data | length')"; fi
          # 5. What the Worker does with the key.
          r=$(s -G "$api/checkout/sessions" -d limit=1)
          if ok "$r"; then echo "Key can use checkout/sessions"; else echo "::error::The key can't use Checkout Sessions (it needs Checkout Sessions: Write): $(echo "$r" | jq -r .error.message)"; fi
      - name: Check it answers
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://ravemonitor.com' https://api.ravemonitor.com/contact || true)
            echo "OPTIONS /contact: $code"
            if [ "$code" = "204" ]; then
              echo "GET /v1/health: $(curl -s -H 'Origin: https://ravemonitor.com' https://api.ravemonitor.com/v1/health)"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::api.ravemonitor.com isn't answering yet. A new custom domain's certificate can take a few minutes."
