<style>
:root { color-scheme: dark; --void: #070814; --deck: #0c0f22; --line: #1f2547; --ink: #eceaf6; --ink-2: #a9abcb; --ink-3: #7c7fa3; --now: #f6ecd8; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--void); color: var(--ink-2); font: 16px/1.6 "Archivo", "Helvetica Neue", Arial, sans-serif; }
a { color: var(--ink); }
a:hover, a:focus-visible { color: var(--now); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; }
.brand svg { width: 22px; height: 22px; color: var(--now); }
.brand span { font-family: "Unbounded", "Archivo", system-ui, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
.back { color: var(--ink-3); font-size: 14px; text-decoration: none; }
main { max-width: 780px; margin: 0 auto; padding: 32px 20px 48px; }
h1 { font-family: "Unbounded", "Archivo", system-ui, sans-serif; font-weight: 800; color: var(--ink); font-size: clamp(24px, 5vw, 34px); line-height: 1.15; margin: 0 0 24px; }
main h2, main h3, main h4 { color: var(--ink); line-height: 1.3; }
main table { border-collapse: collapse; width: 100%; font-size: 14px; }
main th, main td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
footer { border-top: 1px solid var(--line); padding: 18px 20px 28px; text-align: center; font-size: 14px; color: var(--ink-3); }
/* Phones: long policy tables scroll sideways instead of widening the page; links get room for thumbs. */
@media (max-width: 640px) {
  main table { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  main { overflow-wrap: anywhere; }
  footer { line-height: 2.2; padding-bottom: calc(28px + env(safe-area-inset-bottom)); }
}
footer a { color: var(--ink-2); }
</style>

document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('[data-act="privacy-settings"]');
  if (!a) return;
  e.preventDefault();
  try {
    if (window.__ucCmp && typeof window.__ucCmp.showSecondLayer === 'function') window.__ucCmp.showSecondLayer();

  } catch (err) { /* the consent tool isn't loaded */ }
});
